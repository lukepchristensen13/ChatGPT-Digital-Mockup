:root{font-family:Inter,system-ui,sans-serif;color:#182d26;background:#f4f7f5;font-size:16px}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}button,a,input,select{outline-offset:4px}button{border:0;border-radius:10px;padding:12px 18px;background:#135746;color:white;font-weight:650}button.secondary{background:#e7eeea;color:#24483b}button.ghost{background:transparent;color:#355e4e;padding:8px}header{background:white;border-bottom:1px solid #dce5df;padding:18px 5vw;display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{font-size:25px;font-weight:800;letter-spacing:-1px}.brand span{color:#13704e}nav{display:flex;gap:8px}nav button{background:transparent;color:#5c6d65}nav button.active{background:#e6f2ea;color:#135746}main{max-width:1120px;margin:40px auto;padding:0 24px}.eyebrow{font-size:14px;text-transform:uppercase;letter-spacing:2px;color:#557266;font-weight:700}h1{font-size:38px;letter-spacing:-1.4px;margin:8px 0 12px}h2{font-size:22px;margin:0}p{line-height:1.6;color:#607167}.row{display:flex;justify-content:space-between;align-items:center;gap:16px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:26px 0}.stat{background:white;border:1px solid #dce5df;border-radius:14px;padding:22px}.stat strong{font-size:32px;display:block;margin-top:8px}.stat.warn{background:#fff5e4;border-color:#efdbb8}.panel{background:white;border:1px solid #dce5df;border-radius:16px;padding:24px}.tools{display:flex;gap:12px;margin:22px 0}input,select{padding:12px;border:1px solid #cdd9d1;border-radius:9px;background:white;color:#182d26}input{min-width:0}.tools input{flex:1}.food{display:grid;grid-template-columns:1.5fr 1fr 1fr auto;align-items:center;padding:19px 0;border-top:1px solid #e6ece8;gap:14px}.food small{display:block;color:#68796f;margin-top:4px}.badge{font-size:14px;padding:6px 10px;border-radius:20px;display:inline-block;background:#e6f3ea;color:#246743}.badge.soon{background:#fff0d4;color:#8d5a0b}.badge.expired{background:#ffe4e4;color:#9c3030}.empty{padding:35px;text-align:center}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:25px}.recipe{background:white;border:1px solid #dce5df;border-radius:16px;padding:24px}.recipe .num{font-size:14px;color:#8a641d;background:#fff1d4;border-radius:6px;padding:7px 10px;display:inline-block;margin-bottom:25px}.recipe h2{margin:0 0 12px}.recipe button{width:100%;margin-top:20px}dialog{border:1px solid #dce5df;border-radius:18px;padding:28px;max-width:520px;width:calc(100% - 32px)}dialog::backdrop{background:#142a2380}label{display:block;font-size:14px;font-weight:650;margin-top:18px}label input,label select{width:100%;margin-top:8px}.actions{display:flex;justify-content:flex-end;gap:12px;margin-top:25px}.login{max-width:980px;margin:8vh auto;display:grid;grid-template-columns:1fr 1fr;background:white;border-radius:24px;overflow:hidden;border:1px solid #dce5df}.intro{background:#135746;color:white;padding:55px 40px;display:flex;flex-direction:column;justify-content:center}.intro h1{font-size:48px;line-height:1.1}.intro p{color:#c6e0d2}.intro .eyebrow{color:#bddece}.intro .steps{margin-top:35px;border-top:1px solid #ffffff30;padding-top:22px;line-height:2.5}.loginform{padding:45px}.loginform button{width:100%;margin-top:24px}.demo{background:#f1f5f2;padding:16px;border-radius:10px;font-size:14px;line-height:1.8;margin-top:24px}.error{color:#a52c2c;font-size:14px}.note{font-size:14px;color:#667b6d}.shopping{display:flex;align-items:center;justify-content:space-between;padding:18px 0;border-top:1px solid #e6ece8}.shopping label{margin:0;font-size:16px;display:flex;align-items:center;gap:12px}.shopping input{width:20px;height:20px;margin:0}.checked{text-decoration:line-through;color:#8a958e}#toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:#182d26;color:white;padding:14px 22px;border-radius:12px;z-index:10}ul,ol{line-height:1.9;padding-left:23px}@media(max-width:760px){header{flex-wrap:wrap;padding:16px 20px}nav{width:100%;justify-content:space-between}nav button{font-size:14px;padding:10px}main{margin:25px auto;padding:0 16px}h1{font-size:30px}.stats{gap:8px}.stat{padding:16px 12px;font-size:14px}.stat strong{font-size:27px}.food{grid-template-columns:1fr auto}.food .qty{grid-column:1}.food .date{grid-column:2;grid-row:1}.food .edit{grid-column:2;grid-row:2}.cards{grid-template-columns:1fr}.panel{padding:18px}.login{margin:20px 16px;grid-template-columns:1fr}.intro{padding:30px}.intro h1{font-size:36px}.intro .steps{display:none}.loginform{padding:28px}.tools{flex-wrap:wrap}.tools input{flex-basis:100%}.row{align-items:flex-start}}

</style></head><body><div id="app"></div><dialog id="modal"></dialog><div id="toast" hidden role="status"></div><script>
const $=s=>document.querySelector(s),app=$('#app'),modal=$('#modal');let page='inventory',filter='all',query='',logged=false;const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function dateIn(n){let d=new Date();d.setDate(d.getDate()+n);return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
const seed=()=>[{id:1,name:'Spinach',qty:1,unit:'bag',place:'Fridge',date:dateIn(1)},{id:2,name:'Chicken',qty:2,unit:'portions',place:'Fridge',date:dateIn(3)},{id:3,name:'Rice',qty:1,unit:'bag',place:'Pantry',date:dateIn(90)},{id:4,name:'Eggs',qty:6,unit:'eggs',place:'Fridge',date:dateIn(8)},{id:5,name:'Milk',qty:1,unit:'carton',place:'Fridge',date:dateIn(7)},{id:6,name:'Pasta',qty:1,unit:'box',place:'Pantry',date:dateIn(120)}];let foods=seed(),shopping=[],saved=[],selected=null,recipeMode='suggested';let accounts=[{first:'Demo',email:'demo@foodwise.com',username:'demo',password:'FoodWise1234!'}],current=accounts[0];
const recipes=[{id:1,name:'Chicken & spinach rice bowl',time:25,ingredients:['Chicken','Spinach','Rice'],steps:['Cook rice according to package directions.','Cook chicken in a skillet until fully cooked (165°F internal temperature).','Add spinach and stir until wilted. Serve over rice.']},{id:2,name:'Spinach scrambled eggs',time:10,ingredients:['Spinach','Eggs'],steps:['Wash spinach and sauté in a skillet.','Whisk eggs, add to the skillet, and stir until fully set.','Season to taste and serve.']},{id:3,name:'Tomato pasta',time:20,ingredients:['Pasta','Tomatoes'],steps:['Cook pasta according to package directions.','Chop tomatoes and simmer in a skillet with a splash of water.','Drain pasta and toss with the tomatoes.']}];
function days(f){return Math.ceil((new Date(f.date+'T00:00:00')-new Date(new Date().toDateString()))/86400000)}function tag(f){let n=days(f);return `<span class="badge ${n<0?'expired':n<=3?'soon':''}">${n<0?'Expired':n===0?'Expires today':n===1?'Expires tomorrow':n<=3?'Expires in '+n+' days':new Date(f.date+'T00:00:00').toLocaleDateString(undefined,{month:'short',day:'numeric'})}</span>`}function toast(t){$('#toast').textContent=t;$('#toast').hidden=false;setTimeout(()=>$('#toast').hidden=true,3000)}
function originalLogin(){app.innerHTML=`<main class="login"><section class="intro"><div class="eyebrow">A little less waste. A little more dinner.</div><h1>Make the most<br>of your kitchen.</h1><p>Know what you have. Use it before it expires. Find your next meal.</p><div class="steps">01 &nbsp; Keep your food in one place<br>02 &nbsp; See what needs using first<br>03 &nbsp; Cook with what you already have</div></section><section class="loginform"><div class="brand">Food<span>Wise</span></div><h2 style="margin-top:30px">Welcome back</h2><p>Log in to your kitchen.</p><form id="login"><label>Email<input id="email" type="email" autocomplete="username" required value="demo@foodwise.com"></label><label>Password<input id="password" type="password" autocomplete="current-password" required value="FoodWise1234!"></label><p class="error" id="error" role="alert"></p><button>Log in</button></form><div class="demo"><b>Demo account</b><br>demo@foodwise.com<br>FoodWise1234!<br><span class="note">Sample data only. Changes last until this page is refreshed.</span></div></section></main>`;$('#login').onsubmit=e=>{e.preventDefault();if($('#email').value.trim().toLowerCase()==='demo@foodwise.com'&&$('#password').value==='FoodWise1234!'){logged=true;render()}else $('#error').textContent='Use the demo email and password shown below.'}}
function render(){if(!logged)return login();app.innerHTML=`<header><div class="brand">Food<span>Wise</span></div><nav>${[['recipes','Recipes'],['inventory','Food inventory'],['grocery','Grocery list']].map(([id,t])=>`<button data-page="${id}" class="${page===id?'active':''}">${t}</button>`).join('')}</nav><button class="ghost" id="logout">Log out</button></header><main><div class="eyebrow">Your kitchen</div>${page==='inventory'||page==='soon'?inventory():page==='recipes'?recipeList():grocery()}<p class="note" style="margin-top:24px">Demo kitchen · Changes are temporary. <button class="ghost" id="reset">Reset sample data</button></p></main>`;document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{page=b.dataset.page;if(page==='recipes')recipeMode=saved.length?'saved':'suggested';query='';filter='all';selected=null;render()});$('#logout').onclick=()=>{logged=false;login()};$('#reset').onclick=()=>{foods=seed();shopping=[];saved=[];render();toast('Demo kitchen reset')};bind()}
function inventory(){let list=foods.filter(f=>(page!=='soon'||days(f)<=3)&&(filter==='all'||f.place===filter)&&f.name.toLowerCase().includes(query.toLowerCase())).sort((a,b)=>a.date.localeCompare(b.date));return `<div class="row"><div><h1>${page==='soon'?'Use these first':'My food'}</h1><p style="margin:0">${page==='soon'?'A quick look at what is expiring in the next 3 days.':'A clear view of what’s in your fridge, freezer, and pantry.'}</p></div><button id="add">+ Add food</button></div><div class="alerts">${foods.filter(f=>[7,3,1].includes(days(f))).map(f=>`<div>◷ ${esc(f.name)} expires in ${days(f)} day${days(f)===1?'':'s'}.</div>`).join('')}<small>Expiration alerts preview · 7, 3, and 1 day reminders</small></div><div class="stats"><div class="stat">Food items<strong>${foods.length}</strong></div><div class="stat warn">Expiring soon<strong>${foods.filter(f=>days(f)>=0&&days(f)<=3).length}</strong></div><div class="stat">Expired<strong>${foods.filter(f=>days(f)<0).length}</strong></div></div><section class="panel"><div class="row"><h2>${page==='soon'?'Expiration watch':'Your inventory'}</h2><span class="note">Soonest expiration first</span></div><div class="tools"><input id="search" aria-label="Search food" placeholder="Search your food" value="${esc(query)}"><select id="filter" aria-label="Storage location">${['all','Fridge','Freezer','Pantry'].map(x=>`<option value="${x}" ${filter===x?'selected':''}>${x==='all'?'All locations':x}</option>`).join('')}</select></div><div id="foodlist">${list.map(f=>`<div class="food"><div><span class="foodicon" aria-hidden="true">${foodIcon(f.name)}</span> <b>${esc(f.name)}</b><small>${f.place}</small></div><div class="qty">${f.qty} ${esc(f.unit)}<small>${esc(f.details||'')}</small></div><div class="date">${tag(f)}</div><label class="pick"><input type="radio" name="selectedfood" data-select="${f.id}" ${selected===f.id?'checked':''} aria-label="Select ${esc(f.name)}"></label></div>`).join('')||'<div class="empty">No food matches this view.</div>'}</div>${selected?'<div class="selection"><span>1 item selected</span><button id="editselected">Edit</button><button class="secondary" id="deleteselected">Delete</button></div>':''}</section>`}
function missing(r){return r.ingredients.filter(n=>!foods.some(f=>f.name.toLowerCase()===n.toLowerCase()&&days(f)>=0))}function recipeList(){let list=recipes.filter(r=>recipeMode==='saved'?saved.includes(r.id):r.ingredients.some(n=>foods.some(f=>f.name.toLowerCase()===n.toLowerCase()&&days(f)>=0)));return `<div class="row"><div><h1>${recipeMode==='saved'?'Saved recipes':'Suggested recipes'}</h1><p>${recipeMode==='saved'?'Your favorites, ready when you need them.':'Meal ideas using at least one ingredient you already have.'}</p></div></div><div class="tools"><button id="modesaved" class="${recipeMode==='saved'?'':'secondary'}">Saved recipes (${saved.length})</button><button id="modesuggested" class="${recipeMode==='suggested'?'':'secondary'}">Suggested recipes</button></div>${!foods.length&&recipeMode==='suggested'?'<div class="panel empty">add food items to see recipe ideas.</div>':!list.length?'<div class="panel empty">'+(recipeMode==='saved'?'No saved recipes yet. Choose Suggested recipes to find a meal.':'No recipes match your inventory yet. Try adding eggs, spinach, chicken, rice, pasta, or tomatoes.')+'</div>':`<div class="recipeaccordions">${list.map(r=>`<details class="panel"><summary><strong>${r.name}</strong><span>${r.time} minutes</span></summary><h3>Ingredients</h3><ul>${r.ingredients.map(x=>`<li>${x} ${missing(r).includes(x)?'<span class="badge soon">Missing</span>':'<span class="badge">In your inventory</span>'}</li>`).join('')}</ul><h3>Steps</h3><ol>${r.steps.map(x=>`<li>${x}</li>`).join('')}</ol><div class="actions"><button class="secondary" data-save="${r.id}">${saved.includes(r.id)?'Remove from saved':'Save recipe'}</button>${missing(r).length?`<button data-addmissing="${r.id}">Add missing items to grocery list</button>`:''}</div></details>`).join('')}</div>`}`}
function grocery(){return `<h1>Grocery list</h1><p>Pick up what’s missing and check it off as you shop.</p><section class="panel"><div class="row"><h2>Your shopping list</h2><button class="secondary" id="suggestshopping">See suggested items</button></div><form id="groceryform" class="tools"><input id="groceryinput" required maxlength="80" placeholder="Add an item, like tomatoes" aria-label="Grocery item"><button>Add item</button></form>${shopping.map((x,i)=>`<div class="shopping"><label class="${x.done?'checked':''}"><input type="checkbox" data-check="${i}" ${x.done?'checked':''}>${esc(x.name)}</label><div><button class="ghost" data-groceryedit="${i}">Edit</button><button class="ghost" data-remove="${i}" aria-label="Remove ${esc(x.name)}">Remove</button></div></div>`).join('')||'<div class="empty">Your list is empty. Add an item or find a recipe to add missing ingredients.</div>'}</section>`}
function addShopping(name){if(!shopping.some(x=>x.name.toLowerCase()===name.toLowerCase()))shopping.push({name,done:false})}
function bind(){document.querySelectorAll('[data-addmissing]').forEach(b=>b.onclick=()=>{missing(recipes.find(r=>r.id===Number(b.dataset.addmissing))).forEach(addShopping);toast('Missing ingredients added to grocery list')});document.querySelectorAll('[data-select]').forEach(b=>b.onchange=()=>{selected=Number(b.dataset.select);render()});if($('#editselected'))$('#editselected').onclick=()=>foodForm(selected);if($('#deleteselected'))$('#deleteselected').onclick=()=>deleteFood(selected);if($('#modesaved'))$('#modesaved').onclick=()=>{recipeMode='saved';render()};if($('#modesuggested'))$('#modesuggested').onclick=()=>{recipeMode='suggested';render()};if($('#suggestshopping'))$('#suggestshopping').onclick=shoppingSuggestions;document.querySelectorAll('[data-groceryedit]').forEach(b=>b.onclick=()=>editGrocery(Number(b.dataset.groceryedit)));if($('#add'))$('#add').onclick=()=>foodForm();if($('#search')){$('#search').oninput=e=>{let pos=e.target.selectionStart;query=e.target.value;render();$('#search').focus();$('#search').setSelectionRange(pos,pos)};$('#filter').onchange=e=>{filter=e.target.value;render()}}document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>foodForm(Number(b.dataset.edit)));document.querySelectorAll('[data-recipe]').forEach(b=>b.onclick=()=>recipeDialog(Number(b.dataset.recipe)));document.querySelectorAll('[data-save]').forEach(b=>b.onclick=()=>{let id=Number(b.dataset.save);saved=saved.includes(id)?saved.filter(x=>x!==id):[...saved,id];render()});if($('#groceryform'))$('#groceryform').onsubmit=e=>{e.preventDefault();let n=$('#groceryinput').value.trim();if(n){addShopping(n);render();toast('Added to grocery list')}};document.querySelectorAll('[data-check]').forEach(b=>b.onchange=()=>{shopping[Number(b.dataset.check)].done=b.checked;render()});document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{shopping.splice(Number(b.dataset.remove),1);render()})}
function foodForm(id){let f=foods.find(x=>x.id===id)||{name:'',qty:1,unit:'items',place:'Fridge',date:dateIn(7)};modal.innerHTML=`<h2>${id?'Edit food':'Add food'}</h2><form id="foodform" novalidate><label>Food name<input name="name" maxlength="80" required value="${esc(f.name)}"></label><label>Quantity<input name="qty" type="number" min="1" step="1" required value="${f.qty}"></label><label>Unit<input name="unit" maxlength="30" required value="${esc(f.unit)}"></label><label>Details (optional)<input name="details" maxlength="150" value="${esc(f.details||'')}"></label><label>Price per item (optional)<input name="price" type="number" min="0" step="0.01" value="${f.price||''}"></label><label>Storage location<select name="place">${['Fridge','Freezer','Pantry'].map(x=>`<option ${f.place===x?'selected':''}>${x}</option>`).join('')}</select></label><label>Expiration date<input name="date" type="date" required value="${f.date}"></label><p id="fooderror" class="error" role="alert"></p><div class="actions">${id?'<button type="button" class="ghost" id="delete">Remove food</button>':''}<button type="button" class="secondary" id="cancel">Cancel</button><button>Save food</button></div></form>`;modal.showModal();$('#cancel').onclick=()=>modal.close();if(id)$('#delete').onclick=()=>{deleteFood(id)};$('#foodform').onsubmit=e=>{e.preventDefault();let v=Object.fromEntries(new FormData(e.target));let error=validateFood(v);if(error){$('#fooderror').textContent=error;return;}let item={...v,name:v.name.trim(),unit:v.unit.trim(),qty:Number(v.qty),id:id||Date.now()};foods=id?foods.map(x=>x.id===id?item:x):[...foods,item];modal.close();render();toast('Food saved')}}
function recipeDialog(id){let r=recipes.find(x=>x.id===id),m=missing(r);modal.innerHTML=`<h2>${r.name}</h2><p>${r.time} minutes · 1–2 servings</p><h3>Ingredients</h3><ul>${r.ingredients.map(x=>`<li>${x}${m.includes(x)?' <span class="badge soon">Missing</span>':''}</li>`).join('')}</ul><h3>Steps</h3><ol>${r.steps.map(x=>`<li>${x}</li>`).join('')}</ol><div class="actions"><button class="secondary" id="close">Close</button>${m.length?'<button id="missing">Add missing to list</button>':''}</div>`;modal.showModal();$('#close').onclick=()=>modal.close();if($('#missing'))$('#missing').onclick=()=>{m.forEach(addShopping);modal.close();toast('Missing ingredients added to grocery list')}}

function validateFood(v){if(!v.name.trim())return 'Please enter a food item name';if(!v.qty)return 'Please enter an item quantity';if(!Number.isInteger(Number(v.qty))||Number(v.qty)<1)return 'Please enter a quantity greater than zero (minimum 1)';if(!v.date)return 'Please enter an expiration date';if(v.date<dateIn(0))return 'Please enter a date on or after the current date';if(!v.unit.trim())return 'Please enter a unit';return ''}
function foodIcon(name){return ({spinach:'🥬',chicken:'🍗',rice:'🍚',eggs:'🥚',milk:'🥛',pasta:'🍝',tomatoes:'🍅'})[name.toLowerCase()]||'🥣'}
function deleteFood(id){modal.close();modal.innerHTML=`<h2>Delete this food?</h2><p>${esc(foods.find(f=>f.id===id).name)} will be removed from your inventory.</p><div class="actions"><button class="secondary" id="canceldelete">Cancel</button><button id="confirmdelete">Delete food</button></div>`;modal.showModal();$('#canceldelete').onclick=()=>modal.close();$('#confirmdelete').onclick=()=>{foods=foods.filter(f=>f.id!==id);selected=null;modal.close();render();toast('Food removed')}}
function editGrocery(i){modal.innerHTML=`<h2>Edit grocery item</h2><form id="editgrocery"><label>Item name<input id="editname" maxlength="80" required value="${esc(shopping[i].name)}"></label><div class="actions"><button type="button" class="secondary" id="cancel">Cancel</button><button>Save</button></div></form>`;modal.showModal();$('#cancel').onclick=()=>modal.close();$('#editgrocery').onsubmit=e=>{e.preventDefault();if(!$('#editname').value.trim())return;shopping[i].name=$('#editname').value.trim();modal.close();render()}}
function shoppingSuggestions(){let suggestions=foods.filter(f=>f.qty<=1||days(f)<=3).map(f=>f.name);modal.innerHTML=`<h2>Suggested items</h2><p>Restock items with only 1 left or expiring within 3 days.</p>${suggestions.map(n=>`<div class="shopping"><span>${esc(n)}</span><button data-suggestion="${esc(n)}">Add to list</button></div>`).join('')||'<p>No items need restocking right now.</p>'}<p class="note">Frequent purchases need shopping history; this demo uses low quantities and expiration dates.</p><div class="actions"><button class="secondary" id="close">Done</button></div>`;modal.showModal();$('#close').onclick=()=>{modal.close();render()};document.querySelectorAll('[data-suggestion]').forEach(b=>b.onclick=()=>{addShopping(b.dataset.suggestion);b.textContent='Added';b.disabled=true;toast('Added to grocery list')})}
function authFrame(content){app.innerHTML=`<main class="login"><section class="intro"><div class="eyebrow">Your food. Your meals.</div><h1>Make the most<br>of your kitchen.</h1><p>Keep food fresh, plan simple meals, and shop with less guesswork.</p><div class="steps">01 &nbsp; Track your ingredients<br>02 &nbsp; Use food before it expires<br>03 &nbsp; Find recipes you’ll love</div></section><section class="loginform"><div class="brand">Food<span>Wise</span></div>${content}<p class="note">Prototype only. Use made-up personal details. Accounts and changes reset when this page is refreshed.</p></section></main>`}
function signup(){authFrame(`<h2 style="margin-top:25px">Create your account</h2><p>Start organizing your kitchen.</p><form id="signup" novalidate>${[['first','First name','text'],['last','Last name','text'],['email','Email address','email'],['phone','Phone number','tel'],['birth','Birth date','date'],['university','University (optional)','text'],['address','Address','text'],['username','Username','text'],['password','Password','password']].map(([n,l,t])=>`<label>${l}<input name="${n}" type="${t}" maxlength="150" ${n==='university'?'':'required'}></label>`).join('')}<p class="note">Password: at least 12 characters, 1 uppercase letter, and 1 special character.</p><p id="autherror" class="error" role="alert"></p><button>Create account</button></form><div class="actions"><button class="ghost" id="tologin">Already have an account? Log in</button></div><div class="demo"><b>Try the demo</b><br>Username: demo<br>Email: demo@foodwise.com<br>Password: FoodWise1234!</div>`);$('#tologin').onclick=login;$('#signup').onsubmit=e=>{e.preventDefault();let v=Object.fromEntries(new FormData(e.target)),error='';for(let [k,val] of Object.entries(v))if(k!=='university'&&!val.trim()){error='Please enter '+({first:'first name',last:'last name',birth:'birth date'}[k]||k);break}if(!error&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v.email))error='Please enter a valid email address';if(!error&&accounts.some(a=>a.email.toLowerCase()===v.email.toLowerCase()))error='An account with this email already exists.';if(!error&&accounts.some(a=>a.username.toLowerCase()===v.username.toLowerCase()))error='This username is already taken.';if(!error&&(v.password.length<12||!/[A-Z]/.test(v.password)||!/[!-/:-@[-`{-~]/.test(v.password)))error='Password must have at least 12 characters, a special character, and at least 1 capital letter';if(!error&&v.birth>=dateIn(0))error='Please enter a birth date before today';if(error){$('#autherror').textContent=error;return}accounts.push(v);current=v;foods=[];shopping=[];saved=[];logged=true;page='inventory';render();toast('Account created')}}
function login(){authFrame(`<h2 style="margin-top:25px">Welcome back</h2><p>Log in to see your food inventory.</p><form id="login" novalidate><label>Username or email<input id="identity" autocomplete="username" value="demo" required></label><label>Password<input id="password" type="password" autocomplete="current-password" value="FoodWise1234!" required></label><p class="error" id="error" role="alert"></p><button>Log in</button></form><div class="authlinks"><button class="ghost" id="forgot">Forgot password or username?</button><button class="ghost" id="tosignup">Create an account</button></div><div class="demo"><b>Demo login</b><br>Username: demo<br>Email: demo@foodwise.com<br>Password: FoodWise1234!</div>`);$('#tosignup').onclick=signup;$('#forgot').onclick=recovery;$('#login').onsubmit=e=>{e.preventDefault();let ident=$('#identity').value.trim().toLowerCase();let a=accounts.find(a=>(a.username.toLowerCase()===ident||a.email.toLowerCase()===ident)&&a.password===$('#password').value);if(!a){$('#error').textContent='email or password is incorrect.';return}if(current!==a){foods=a===accounts[0]?seed():[];shopping=[];saved=[]}current=a;logged=true;page='inventory';render()}}
function recovery(){authFrame(`<h2 style="margin-top:25px">Recover your account</h2><p>Enter the email address associated with your account.</p><form id="recover"><label>Email address<input type="email" required id="recoveryemail"></label><button>Submit</button></form><div id="recoverresult" role="status"></div><button class="ghost" id="backlogin">Back to login</button>`);$('#backlogin').onclick=login;$('#recover').onsubmit=e=>{e.preventDefault();$('#recoverresult').innerHTML='<p>Check your email account for a password recovery link.</p><p class="note">Demo confirmation only. No email is sent.</p>'}}

signup();
</script></body></html>
